<!-- PART 1: HTML HEAD & INITIAL SETUP -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SCP Foundation - Site Excalibur</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Courier New', Courier, monospace;
      background: black;
      color: #0f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      background-color: #111;
      padding: 10px 20px;
      border-bottom: 2px solid #0f0;
    }
    header img {
      height: 50px;
      margin-right: 20px;
    }
    header h1 {
      font-size: 1.5em;
      animation: glitch 1s infinite;
    }
    @keyframes glitch {
      0% { text-shadow: 2px 2px red; }
      25% { text-shadow: -2px -2px lime; }
      50% { text-shadow: 2px -2px blue; }
      75% { text-shadow: -2px 2px yellow; }
      100% { text-shadow: 2px 2px red; }
    }
    .login-container, .terminal-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .input-field {
      background-color: black;
      color: #0f0;
      border: 1px solid #0f0;
      font-size: 1.2em;
      padding: 10px;
      width: 300px;
      margin-top: 20px;
      border-radius: 5px;
      outline: none;
      text-align: center;
    }
    .terminal {
      width: 100%;
      height: 100%;
      padding: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .terminal-output {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .output-line {
      white-space: pre-wrap;
      margin-bottom: 5px;
    }
    .command-line {
      display: flex;
    }
    .input-line {
      flex: 1;
      background: transparent;
      border: none;
      color: #0f0;
      font-size: 1em;
      outline: none;
    }
  </style>
</head>
<body>

<!-- PART 2: LOGIN SEQUENCE & INITIAL INTERACTION -->
<script>
  const authText = document.getElementById('auth-text');
  const passwordField = document.getElementById('password-field');
  const loginContainer = document.getElementById('login-container');
  const terminalContainer = document.getElementById('terminal-container');
  const terminalOutput = document.getElementById('terminal-output');
  const inputLine = document.getElementById('input-line');

  const bootLines = [
    "[ACCESS LEVEL: O5-Council Only]",
    "Establishing encrypted connection to SCPNET...",
    "Terminal handshake with Site-EX successful.",
    "Routing clearance through O5 Command Core...",
    "Verifying retinal and DNA signatures...",
    "Authentication chain validated.",
    "Authorizing session...",
    "Access Granted to Site Excalibur Mainframe"
  ];

  let loginIndex = 0;

  function typeBootLines() {
    if (loginIndex < bootLines.length) {
      authText.textContent = bootLines[loginIndex];
      loginIndex++;
      setTimeout(typeBootLines, 1300);
    } else {
      authText.textContent = "Enter Password: ********";
      setTimeout(() => {
        typePassword("********", 0);
      }, 800);
    }
  }

  function typePassword(pass, index) {
    if (index < pass.length) {
      passwordField.value += pass[index];
      setTimeout(() => typePassword(pass, index + 1), 180);
    } else {
      setTimeout(() => {
        loginContainer.style.display = 'none';
        terminalContainer.style.display = 'flex';
        welcomeMessage();
      }, 1000);
    }
  }

  function welcomeMessage() {
    printOutput("Welcome, O5-Council Member.");
    printOutput("Access Level: ████████");
    printOutput("Site: Excalibur (Deep Terminal Node: #019-Alpha)");
    printOutput("Type 'help' to view available commands.");
    inputLine.focus();
  }

  function printOutput(text) {
    const line = document.createElement('div');
    line.className = 'output-line';
    line.textContent = text;
    terminalOutput.appendChild(line);
    terminalOutput.scrollTop = terminalOutput.scrollHeight;
  }

  window.onload = () => {
    typeBootLines();
  };
</script>

<script>
  // Command handling logic
  const commands = {
    'help': function() {
      printOutput("Available commands:");
      printOutput("help - Display this message.");
      printOutput("list - List available files.");
      printOutput("scp - Access SCP-related classified documents.");
      printOutput("taskforce - View Task Force operations.");
      printOutput("redacted - Access Redacted/Secret files.");
      printOutput("exit - Exit the terminal.");
    },
    'list': function() {
      printOutput("Listing available files...");
      printOutput("SCP Directory - /scp");
      printOutput("Task Force Directory - /taskforce");
      printOutput("Redacted Files Directory - /redacted");
      printOutput("Type 'scp', 'taskforce', or 'redacted' followed by file number for access.");
    },
    'scp': function() {
      printOutput("Accessing SCP classified files...");
      printOutput("SCP-███ - [REDACTED]");
      printOutput("SCP-███ - [CLASSIFIED]");
      printOutput("SCP-███ - [SECRET]");
      printOutput("SCP-001 - [TOP SECRET]");
    },
    'taskforce': function() {
      printOutput("Accessing Task Force operation logs...");
      printOutput("TF-███ - Operation ████ - [SECRET]");
      printOutput("TF-███ - Operation ████ - [RESTRICTED]");
      printOutput("TF-███ - Operation ████ - [CLASSIFIED]");
    },
    'redacted': function() {
      printOutput("Accessing Redacted/Secret Files...");

      printOutput("File 002 - [CONFIDENTIAL]");
      printOutput("File 003 - [TOP SECRET]");

      printOutput("Exiting terminal...");
      setTimeout(() => {
        window.location.reload();

    }

  // Function to handle commands entered by the user
  function handleCommand(command) {
    if (commands[command]) {
      commands[command]();
    } else {
      printOutput("Unknown command: " + command);
      printOutput("Type 'help' for a list of available commands.");

  // Event listener for command input
  inputLine.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      const command = inputLine.value.trim();
      printOutput("&gt; " + command);
      handleCommand(command);
      inputLine.value = '';
      inputLine.focus();
    }

<script>
  // Create a dynamic suggestion list for user input
  function showSuggestions(query) {
    const suggestions = getSuggestions(query);
    const suggestionContainer = document.createElement('div');
    suggestionContainer.classList.add('suggestions');

    suggestions.forEach((suggestion) => {
      const suggestionItem = document.createElement('div');
      suggestionItem.classList.add('suggestion-item');
      suggestionItem.textContent = suggestion;
      suggestionItem.addEventListener('click', () => {
        inputLine.value = suggestion;
        handleCommand(suggestion);
      });
      suggestionContainer.appendChild(suggestionItem);
    });

    terminalOutput.appendChild(suggestionContainer);
    terminalOutput.scrollTop = terminalOutput.scrollHeight;
  }

  // Get suggestions based on user input
  function getSuggestions(query) {
    const allCommands = ['help', 'list', 'scp', 'taskforce', 'redacted', 'exit'];
    return allCommands.filter(command => command.startsWith(query));
  }

  // Display the help message
  function showHelp() {
    printOutput("Welcome to the O5 Council Terminal.");
    printOutput("Available commands include:");
    printOutput("help - Show this help message.");
    printOutput("list - List available classified files.");
    printOutput("scp - Access SCP-related documents.");
    printOutput("taskforce - View Task Force operations.");
    printOutput("redacted - Access redacted or classified files.");
    printOutput("exit - Exit the terminal.");
    printOutput("Type 'list' to view file directories or 'scp' to access files.");
  }

  // Override the 'help' command to show an enhanced help system
  const commands = {
    'help': function() {
      showHelp();
    },
    'list': function() {
      printOutput("Listing classified directories...");
      printOutput("/scp - SCP-related files");
      printOutput("/taskforce - Task Force operation files");
      printOutput("/redacted - Redacted files");
      printOutput("Type 'scp' to access SCP files or 'taskforce' for task force operations.");
    },
    'scp': function() {
      simulateFileAccessWithSpinner("SCP-███", () => {
        printOutput("SCP-███ - [REDACTED]");
      });
      simulateFileAccessWithSpinner("SCP-████", () => {
        printOutput("SCP-████ - [CLASSIFIED]");
      });
      simulateFileAccessWithSpinner("SCP-001 - The Scarlet King", () => {
        printOutput("SCP-001 - The Scarlet King - [TOP SECRET]");
      });
    },
    'taskforce': function() {
      simulateFileAccessWithSpinner("TF-███ - Operation ████", () => {
        printOutput("TF-███ - Operation ████ - [SECRET]");
      });
      simulateFileAccessWithSpinner("TF-████ - Operation ████", () => {
        printOutput("TF-████ - Operation ████ - [RESTRICTED]");
      });
      simulateFileAccessWithSpinner("TF-█████ - Operation █████", () => {
        printOutput("TF-█████ - Operation █████ - [CLASSIFIED]");
      });
    },
    'redacted': function() {
      simulateFileAccessWithSpinner("File 001 - [REDACTED]", () => {
        printOutput("File 001 - [REDACTED]");
      });
      simulateFileAccessWithSpinner("File 002 - [CONFIDENTIAL]", () => {
        printOutput("File 002 - [CONFIDENTIAL]");
      });
      simulateFileAccessWithSpinner("File 003 - [TOP SECRET]", () => {
        printOutput("File 003 - [TOP SECRET]");
      });
    },
    'exit': function() {
      printOutput("Exiting terminal...");
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    }
  };

  // Update the terminal to handle dynamic suggestions while typing
  inputLine.addEventListener('input', function(event) {
    const query = inputLine.value.trim();
    if (query.length > 0) {
      showSuggestions(query);
    }
  });

  // Ensure suggestions are cleared when the user submits the command
  inputLine.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      const command = inputLine.value.trim();
      printOutput("&gt; " + command);
      handleCommand(command);
      inputLine.value = '';
      inputLine.focus();
      const suggestions = document.querySelector('.suggestions');
      if (suggestions) {
        suggestions.remove();
      }
    }
  });
</script>
