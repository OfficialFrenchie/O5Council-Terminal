<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SCP O5 Council Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #000;
      color: #0f0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      margin: 0;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 20px;
      background-color: #111;
      padding: 10px 20px;
      border-bottom: 2px solid #0f0;
    }
    header img {
      height: 60px;
      filter: grayscale(100%) brightness(0.8);
    }
    .glitch-text {
      font-size: 1.5em;
      position: relative;
      color: #0f0;
      text-shadow: 1px 0 red, -1px 0 blue;
      animation: glitch 1s infinite;
    }
    @keyframes glitch {
      0%, 100% { text-shadow: 2px 0 red, -2px 0 blue; }
      50% { text-shadow: -2px 0 red, 2px 0 blue; }
    }
    .terminal {
      height: calc(100vh - 90px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }
    .boot-screen, .main-terminal {
      display: none;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      width: 100%;
      height: 100%;
      padding: 40px;
      text-align: left;
      overflow: hidden;
    }
    .boot-line, .main-line {
      white-space: pre-wrap;
      margin: 2px 0;
    }
    .typed-line {
      border-right: 2px solid #0f0;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink {
      50% { border-color: transparent; }
    }
    .output-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
      width: 100%;
      overflow: hidden;
      padding: 0 20px;
    }
    .input-line::before {
      content: "> ";
    }
    .hidden {
      display: none !important;
    }
    .main-line {
      font-size: 1.1em;
      color: #0f0;
    }
    .header-line {
      color: #0f0;
      font-size: 1.2em;
    }
    .error-line {
      color: red;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://th.bing.com/th/id/OIP.JPWG2Dz6CCmpyTMAuK9EkAAAAA?rs=1&pid=ImgDetMain" alt="SCP Logo">
    <div class="glitch-text">SCP Foundation – Site Excalibur : O5 Council Terminal</div>
  </header>

  <div class="terminal">
    <div class="boot-screen" id="boot-screen"></div>
    <div class="main-terminal hidden" id="main-terminal">
      <div class="output-wrapper" id="terminal-output">
        <div class="main-line input-line hidden" id="input-line"></div>
      </div>
    </div>
  </div>

  <script>
    const bootScreen = document.getElementById("boot-screen");
    const mainTerminal = document.getElementById("main-terminal");
    const terminalOutput = document.getElementById("terminal-output");
    const inputLine = document.getElementById("input-line");
    const MAX_LINES = 18;

    const bootSequence = [
      "[SCP FOUNDATION INTERNAL SYSTEM]",
      "SITE: EXCALIBUR - TERMINAL NODE 05-SEC",
      "Establishing secure uplink...",
      "Verifying temporal encryption sync...",
      "Council-level biometric handshake: VERIFIED",
      "LOADING TERMINAL ENVIRONMENT...",
      "Authentication Required:",
      "Enter O5 Clearance Credentials: ███-███-████-█"
    ];

    function typeLine(text, callback) {
      let line = document.createElement("div");
      line.className = "boot-line";
      bootScreen.appendChild(line);
      let i = 0;
      function typeChar() {
        if (i < text.length) {
          line.textContent += text[i++];
          setTimeout(typeChar, 35);
        } else {
          callback();
        }
      }
      typeChar();
    }

    function runBootSequence() {
      bootScreen.style.display = "flex";
      let index = 0;
      function nextLine() {
        if (index < bootSequence.length) {
          typeLine(bootSequence[index++], nextLine);
        } else {
          const authLine = document.createElement("div");
          authLine.className = "boot-line";
          authLine.textContent = "ACCESS AUTHORIZED [O5-CNCL]";
          bootScreen.appendChild(authLine);
          setTimeout(transitionToMainTerminal, 1500);
        }
      }
      nextLine();
    }

    function transitionToMainTerminal() {
      bootScreen.classList.add("hidden");
      mainTerminal.classList.remove("hidden");
      addLine("Welcome to SCP Terminal Node: Site Excalibur [O5 Access]");
      addLine("Type \"help\" to view available commands.");
      addLine("Loading secure environment...");
      runCommandInterface();
    }

    function addLine(text, delay = 0) {
      setTimeout(() => {
        const line = document.createElement("div");
        line.className = "main-line";
        line.textContent = text;
        terminalOutput.appendChild(line);
        maintainBuffer();
      }, delay);
    }

    function maintainBuffer() {
      const lines = terminalOutput.querySelectorAll(".main-line");
      if (lines.length > MAX_LINES) {
        lines[0].remove();
      }
    }

    function runCommandInterface() {
      const files = {
        "scp-173": [
          "[FILE: SCP-173]",
          "Object Class: Euclid",
          "Description: Animate statue that moves when not observed.",
          "Special Containment Procedures: Kept in locked container. Line-of-sight by three personnel required during maintenance."
        ],
        "taskforce-epsilon-11": [
          "[FILE: Mobile Task Force Epsilon-11]",
          "Codename: Nine-Tailed Fox",
          "Role: Specialized in internal Foundation security breaches and containment failure response.",
          "Recent Deployment: Incident SCP-106 breach, Site-19."
        ],
        "redacted-logs": [
          "[REDACTED ARCHIVE - LEVEL 5]",
          "Unauthorized access to these documents will be logged and reported.",
          "Access requires retina scan and memetic key.",
          "[REDACTED ██████████████████████████████████████████████████████████████████]"
        ]
      };

      const commandMap = {
        help: [
          "Available Commands:",
          " - help                 → List all available commands",
          " - list                 → Display list of available files",
          " - open [filename]      → View a classified file (e.g., open scp-173)",
          " - logout               → Exit the terminal"
        ],
        list: Object.keys(files).map(f => ` - ${f}`),
        logout: ["Logging out...", "Session terminated."]
      };

      const readline = () => {
        inputLine.classList.remove("hidden");
        inputLine.textContent = "> ";
        let inputBuffer = "";

        document.addEventListener("keydown", function onKey(e) {
          if (e.key.length === 1 && inputBuffer.length < 40) {
            inputBuffer += e.key;
          } else if (e.key === "Backspace") {
            inputBuffer = inputBuffer.slice(0, -1);
          } else if (e.key === "Enter") {
            document.removeEventListener("keydown", onKey);
            inputLine.classList.add("hidden");
            addLine(`> ${inputBuffer}`);

            const [cmd, ...args] = inputBuffer.trim().split(" ");
            const fullCmd = cmd.toLowerCase();

            if (commandMap[fullCmd]) {
              commandMap[fullCmd].forEach((line, i) => addLine(line, i * 100));
            } else if (fullCmd === "open") {
              const target = args.join("-").toLowerCase();
              if (files[target]) {
                files[target].forEach((line, i) => addLine(line, i * 100));
              } else {
                addLine("File not found. Try \"list\" for available files.", 300);
              }
            } else {
              addLine("Unknown command. Type \"help\" for assistance.", 300);
            }

            setTimeout(() => readline(), 1000);
          }

          inputLine.textContent = `> ${inputBuffer}`;
        });
      };

      setTimeout(() => {
        addLine('Type "help" to list commands.', 300);
        setTimeout(() => readline(), 1000);
      }, 500);
    }

    window.onload = runBootSequence;
  </script>
</body>
</html>
