<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP O5 Council Terminal - Login</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: black;
            color: #0f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Login Screen */
        .login-container {
            text-align: center;
            padding: 20px;
            background-color: #222;
            border: 2px solid #0f0;
            border-radius: 10px;
        }

        .login-header {
            font-size: 1.8em;
            font-weight: bold;
        }

        .input-field {
            background-color: black;
            color: #0f0;
            border: 1px solid #0f0;
            font-size: 1.2em;
            padding: 10px;
            width: 250px;
            margin-top: 20px;
            border-radius: 5px;
            outline: none;
        }

        .input-field:focus {
            border-color: yellow;
        }

        .terminal-container {
            display: none;
            width: 100%;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .terminal-output {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            padding-right: 15px;
            font-size: 1.2em;
        }

        .command-line {
            display: flex;
            width: 100%;
        }

        .input-line {
            width: 100%;
            border: none;
            outline: none;
            color: #0f0;
            background: transparent;
            font-size: 1.1em;
            padding: 5px;
        }

        .input-line:focus {
            border: none;
        }

        .output-line {
            margin: 5px 0;
            white-space: pre-wrap;
        }

        .help-text {
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .redacted {
            color: red;
            font-style: italic;
        }

        .command-description {
            color: #0f0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #0f0;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #111;
        }
    </style>
</head>
<body>
    <!-- Login Interface -->
    <div class="login-container" id="login-container">
        <div class="login-header">SCP Foundation Terminal Login</div>
        <input type="password" id="password-field" class="input-field" placeholder="Enter password" autocomplete="off" autofocus />
    </div>

    <!-- Terminal Interface -->
    <div class="terminal-container" id="terminal-container">
        <div class="terminal-output" id="terminal-output"></div>
        <div class="command-line">
            <input type="text" id="input-line" class="input-line" autocomplete="off" autofocus />
        </div>
    </div>

    <script>
        // Elements
        const loginContainer = document.getElementById("login-container");
        const terminalContainer = document.getElementById("terminal-container");
        const passwordField = document.getElementById("password-field");
        const inputLine = document.getElementById("input-line");
        const terminalOutput = document.getElementById("terminal-output");

        const correctPassword = "O5Council";  // Correct password for login (you can change it)
        const MAX_LINES = 15;  // Max visible lines

        // Login and Terminal Switch
        function startLogin() {
            let typedPassword = "";
            const password = correctPassword;

            function typePassword() {
                if (typedPassword.length < password.length) {
                    typedPassword += password[typedPassword.length];
                    passwordField.value = typedPassword;
                    setTimeout(typePassword, 200);
                } else {
                    setTimeout(showTerminal, 500);
                }
            }

            typePassword();
        }

        // Show Terminal after Successful Login
        function showTerminal() {
            loginContainer.style.display = "none";
            terminalContainer.style.display = "block";
            addLine("Welcome to the SCP Foundation Terminal - Site Excalibur", 500);
            addLine("Type \"help\" for available commands.", 1000);
            inputLine.focus();
        }

        // Command Functions
        const commandFunctions = {
            help: function() {
                return [
                    "Available Commands:",
                    " - help                 → List all available commands",
                    " - list                 → Display list of available files",
                    " - open [filename]      → View a classified file (e.g., open scp-173)",
                    " - logout               → Exit the terminal"
                ];
            },
            list: function() {
                return [
                    "scp-173 - A statue that moves when unobserved.",
                    "taskforce-epsilon-11 - Nine-Tailed Fox mobile task force.",
                    "redacted-logs - Restricted access logs."
                ];
            },
            open: function(args) {
                const fileName = args[0].toLowerCase();
                if (files[fileName]) {
                    return files[fileName];
                } else {
                    return ["Error: File not found. Try \"list\" for available files."];
                }
            },
            logout: function() {
                return ["Logging out...", "Session terminated."];
            }
        };

        // Files in SCP Terminal
        const files = {
            "scp-173": [
                "[FILE: SCP-173]",
                "Object Class: Euclid",
                "Description: Animate statue that moves when not observed.",
                "Special Containment Procedures: Kept in locked container. Line-of-sight by three personnel required during maintenance."
            ],
            "taskforce-epsilon-11": [
                "[FILE: Mobile Task Force Epsilon-11]",
                "Codename: Nine-Tailed Fox",
                "Role: Specialized in internal Foundation security breaches and containment failure response.",
                "Recent Deployment: Incident SCP-106 breach, Site-19."
            ],
            "redacted-logs": [
                "[REDACTED ARCHIVE - LEVEL 5]",
                "Unauthorized access to these documents will be logged and reported.",
                "[REDACTED ██████████████████████████████████████████████████████████████████]"
            ]
        };

        // Helper Functions
        function addLine(text, delay = 0, isError = false) {
            setTimeout(() => {
                const line = document.createElement("div");
                line.className = `output-line ${isError ? 'error-line' : ''}`;
                line.textContent = text;
                terminalOutput.appendChild(line);
                maintainBuffer();
            }, delay);
        }

        function maintainBuffer() {
            const lines = terminalOutput.querySelectorAll(".output-line");
            if (lines.length > MAX_LINES) {
                lines[0].remove();
            }
        }

        function processCommand(commandString) {
            const [command, ...args] = commandString.trim().split(" ");
            const normalizedCommand = command.toLowerCase();

            if (commandFunctions[normalizedCommand]) {
                const result = commandFunctions[normalizedCommand](args);
                result.forEach((line, i) => addLine(line, i * 300));
            } else {
                addLine("Error: Unknown command. Type \"help\" for assistance.", 300, true);
            }
        }

        // Terminal Input Handling
        function handleInput() {
            const input = inputLine.value.trim();
            if (input === "") return;
            addLine(`> ${input}`, 300);
            processCommand(input);
            inputLine.value = "";  // Clear input field
        }

        // Initialize Terminal
        function initializeTerminal() {
            inputLine.addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    handleInput();
                }
            });
        }

        // Start Terminal Bootup
        window.onload = () => {
            startLogin();
            initializeTerminal();
        };
    </script>
</body>
</html>
