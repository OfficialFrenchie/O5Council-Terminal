<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SCP O5 Council Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #000;
      color: #0f0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 20px;
      background-color: #111;
      padding: 10px 20px;
      border-bottom: 2px solid #0f0;
    }

    header img {
      height: 60px;
      filter: grayscale(100%) brightness(0.8);
    }

    .glitch-text {
      font-size: 1.2em;
      position: relative;
      color: #0f0;
      text-shadow: 1px 0 red, -1px 0 blue;
      animation: glitch 1s infinite;
    }

    @keyframes glitch {
      0%, 100% { text-shadow: 2px 0 red, -2px 0 blue; }
      50% { text-shadow: -2px 0 red, 2px 0 blue; }
    }

    .terminal {
      height: calc(100vh - 90px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .boot-screen, .main-terminal {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      text-align: center;
    }

    .boot-line, .main-line {
      white-space: pre-wrap;
      margin: 2px 0;
    }

    .typed-line {
      border-right: 2px solid #0f0;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .output-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
      width: 100%;
      overflow: hidden;
      padding: 0 20px;
    }

    .input-line::before {
      content: "> ";
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://cdn.discordapp.com/attachments/907049520309895189/1367284032513114243/image.png?ex=681405fc&is=6812b47c&hm=fb9e5a794eeb132782f292ef900e45235c97fdc8b70ece86c0564b3b0baf5445&" alt="SCP Logo">
    <div class="glitch-text">SCP Foundation – Site Excalibur : O5 Council Terminal</div>
  </header>

  <div class="terminal">
    <!-- Booting/Login screen -->
    <div class="boot-screen" id="boot-screen">
      <!-- Boot sequence lines added via JS -->
    </div>

    <!-- Main terminal -->
    <div class="main-terminal hidden" id="main-terminal">
      <div class="output-wrapper" id="terminal-output">
        <div class="main-line input-line hidden" id="input-line"></div>
      </div>
    </div>
  </div>

  <script>
    const bootScreen = document.getElementById("boot-screen");
    const mainTerminal = document.getElementById("main-terminal");
    const terminalOutput = document.getElementById("terminal-output");
    const inputLine = document.getElementById("input-line");
    const MAX_LINES = 18;

    const bootSequence = [
      "Initializing SCP SecureOS...",
      "Routing access through Foundation net...",
      "Bypassing Site-Excalibur lockdown protocols...",
      "Loading secure shell instance...",
      "Fetching O5 clearance modules...",
      "Decrypting access key...",
      "LOGIN REQUIRED:",
      "Enter Credentials: "
    ];

    let bootIndex = 0;
    let charIndex = 0;
    let credentials = "████████████████";
    let typedSpan;

    function showBootLine(text, isFinal = false) {
      const line = document.createElement("div");
      line.className = "boot-line";
      if (isFinal) {
        line.innerHTML = `${text}<span class="typed-line" id="typed"></span>`;
        typedSpan = document.getElementById("typed");
      } else {
        line.textContent = text;
      }
      bootScreen.appendChild(line);
    }

    function simulateBootSequence() {
      bootScreen.style.display = "flex";
      const interval = setInterval(() => {
        if (bootIndex < bootSequence.length - 1) {
          showBootLine(bootSequence[bootIndex++]);
        } else {
          clearInterval(interval);
          setTimeout(() => {
            showBootLine(bootSequence[bootIndex], true);
            simulateTyping();
          }, 500);
        }
      }, 600);
    }

    function simulateTyping() {
      if (charIndex < credentials.length) {
        typedSpan.textContent += credentials[charIndex++];
        setTimeout(simulateTyping, 250);
      } else {
        setTimeout(() => {
          const authLine = document.createElement("div");
          authLine.className = "boot-line";
          authLine.textContent = "ACCESS AUTHORIZED";
          bootScreen.appendChild(authLine);
          setTimeout(() => transitionToMainTerminal(), 1500);
        }, 500);
      }
    }

    function transitionToMainTerminal() {
      bootScreen.classList.add("hidden");
      mainTerminal.classList.remove("hidden");
      addLine("Welcome to SCP Terminal Node: Site Excalibur [O5 Access]");
      runCommandInterface();
    }

    function addLine(text, delay = 0) {
      setTimeout(() => {
        const line = document.createElement('div');
        line.className = 'main-line';
        line.textContent = text;
        terminalOutput.appendChild(line);
        maintainBuffer();
      }, delay);
    }

    function maintainBuffer() {
      const lines = terminalOutput.querySelectorAll('.main-line');
      if (lines.length > MAX_LINES) {
        lines[0].remove();
      }
    }

    function runCommandInterface() {
      const commandMap = {
        help: [
          'Available Commands:',
          ' - help         → List all available commands',
          ' - list         → Display classified documents',
          ' - access [id]  → Access a specific file (e.g., access O5-█)',
          ' - logout       → Exit the terminal'
        ],
        list: [
          'Secure Files:',
          ' - O5-█.scpd',
          ' - SiteEx-47-Report.txt',
          ' - Event-BlackoutLog.docx'
        ],
        logout: ['Logging out...', 'Session terminated.']
      };

      const readline = () => {
        inputLine.classList.remove('hidden');
        inputLine.textContent = '> ';
        let inputBuffer = '';

        document.addEventListener('keydown', function onKey(e) {
          if (e.key.length === 1 && inputBuffer.length < 40) {
            inputBuffer += e.key;
          } else if (e.key === 'Backspace') {
            inputBuffer = inputBuffer.slice(0, -1);
          } else if (e.key === 'Enter') {
            document.removeEventListener('keydown', onKey);
            inputLine.classList.add('hidden');
            addLine(`> ${inputBuffer}`);

            const cmd = inputBuffer.trim().split(' ')[0].toLowerCase();
            const param = inputBuffer.trim().split(' ')[1];

            if (commandMap[cmd]) {
              commandMap[cmd].forEach((line, i) => addLine(line, i * 100));
            } else if (cmd === 'access' && param) {
              addLine(`Accessing file: ${param}...`);
              addLine(`[REDACTED CONTENT - LEVEL 5 REQUIRED]`, 500);
            } else {
              addLine('Unknown command. Type "help" for assistance.');
            }

            setTimeout(() => readline(), 1000);
          }

          inputLine.textContent = `> ${inputBuffer}`;
        });
      };

      setTimeout(() => {
        addLine('Type "help" to list commands.', 300);
        setTimeout(() => readline(), 1000);
      }, 500);
    }

    // Begin boot sequence on page load
    window.onload = simulateBootSequence;
  </script>
</body>
</html>
