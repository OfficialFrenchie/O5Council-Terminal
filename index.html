<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP O5 Council Terminal</title>
    <style>
        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: black;
            color: #0f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            overflow: hidden;
        }

        header {
            width: 100%;
            background-color: #111;
            padding: 10px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid #0f0;
        }

        header img {
            height: 60px;
            filter: grayscale(100%) brightness(0.8);
        }

        .glitch-text {
            font-size: 1.8em;
            font-weight: bold;
            color: #0f0;
            text-shadow: 2px 0 red, -2px 0 blue;
            animation: glitch 1s infinite;
        }

        @keyframes glitch {
            0%, 100% {
                text-shadow: 2px 0 red, -2px 0 blue;
            }

            50% {
                text-shadow: -2px 0 red, 2px 0 blue;
            }
        }

        .terminal-container {
            width: 100%;
            max-width: 1000px;
            height: calc(100vh - 80px);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 20px;
        }

        .terminal-output {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            padding-right: 15px;
            font-size: 1.2em;
        }

        .command-line {
            display: flex;
            width: 100%;
        }

        .input-line {
            width: 100%;
            border: none;
            outline: none;
            color: #0f0;
            background: transparent;
            font-size: 1.1em;
            padding: 5px;
            white-space: nowrap;
            margin-left: 5px;
        }

        .input-line:focus {
            border: none;
        }

        .output-line {
            margin: 5px 0;
            white-space: pre-wrap;
        }

        .error-line {
            color: red;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .help-text {
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .command-description {
            color: #0f0;
        }

        .hidden-scroll {
            overflow: hidden;
        }

        .terminal-header {
            color: #0f0;
            font-size: 1.5em;
            font-weight: bold;
        }

        .redacted {
            color: red;
            font-style: italic;
        }

        .file-content {
            padding-left: 20px;
            font-size: 1.1em;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #0f0;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #111;
        }

    </style>
</head>
<body>
    <header>
        <img src="https://th.bing.com/th/id/OIP.JPWG2Dz6CCmpyTMAuK9EkAAAAA?rs=1&pid=ImgDetMain" alt="SCP Logo">
        <div class="glitch-text">SCP Foundation - Site Excalibur : O5 Council Terminal</div>
    </header>

    <div class="terminal-container">
        <div class="terminal-output" id="terminal-output"></div>
        <div class="command-line">
            <input type="text" id="input-line" class="input-line" autocomplete="off" autofocus />
        </div>
    </div>

    <script>
        // Elements
        const terminalOutput = document.getElementById("terminal-output");
        const inputLine = document.getElementById("input-line");

        const MAX_LINES = 15;  // Max visible lines

        // Files in SCP Terminal
        const files = {
            "scp-173": [
                "[FILE: SCP-173]",
                "Object Class: Euclid",
                "Description: Animate statue that moves when not observed.",
                "Special Containment Procedures: Kept in locked container. Line-of-sight by three personnel required during maintenance."
            ],
            "taskforce-epsilon-11": [
                "[FILE: Mobile Task Force Epsilon-11]",
                "Codename: Nine-Tailed Fox",
                "Role: Specialized in internal Foundation security breaches and containment failure response.",
                "Recent Deployment: Incident SCP-106 breach, Site-19."
            ],
            "redacted-logs": [
                "[REDACTED ARCHIVE - LEVEL 5]",
                "Unauthorized access to these documents will be logged and reported.",
                "[REDACTED ██████████████████████████████████████████████████████████████████]"
            ]
        };

        // Command Functions
        const commandFunctions = {
            help: function() {
                return [
                    "Available Commands:",
                    " - help                 → List all available commands",
                    " - list                 → Display list of available files",
                    " - open [filename]      → View a classified file (e.g., open scp-173)",
                    " - logout               → Exit the terminal"
                ];
            },
            list: function() {
                return Object.keys(files).map(file => ` - ${file}`);
            },
            open: function(args) {
                const fileName = args[0].toLowerCase();
                if (files[fileName]) {
                    return files[fileName];
                } else {
                    return ["Error: File not found. Try \"list\" for available files."];
                }
            },
            logout: function() {
                return ["Logging out...", "Session terminated."];
            }
        };

        // Helper Functions
        function addLine(text, delay = 0, isError = false) {
            setTimeout(() => {
                const line = document.createElement("div");
                line.className = `output-line ${isError ? 'error-line' : ''}`;
                line.textContent = text;
                terminalOutput.appendChild(line);
                maintainBuffer();
            }, delay);
        }

        function maintainBuffer() {
            const lines = terminalOutput.querySelectorAll(".output-line");
            if (lines.length > MAX_LINES) {
                lines[0].remove();
            }
        }

        function processCommand(commandString) {
            const [command, ...args] = commandString.trim().split(" ");
            const normalizedCommand = command.toLowerCase();

            if (commandFunctions[normalizedCommand]) {
                const result = commandFunctions[normalizedCommand](args);
                result.forEach((line, i) => addLine(line, i * 300));
            } else {
                addLine("Error: Unknown command. Type \"help\" for assistance.", 300, true);
            }
        }

        // Terminal Input Handling
        function handleInput() {
            const input = inputLine.value.trim();
            if (input === "") return;
            addLine(`> ${input}`, 300);
            processCommand(input);
            inputLine.value = "";  // Clear input field
        }

        // Initialize Terminal
        function initializeTerminal() {
            addLine("Welcome to the SCP Foundation Terminal - Site Excalibur");
            addLine("Type \"help\" for available commands.");
            inputLine.focus();

            inputLine.addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    handleInput();
                }
            });
        }

        // Start Terminal Bootup
        window.onload = () => {
            initializeTerminal();
        };
    </script>
</body>
</html>
