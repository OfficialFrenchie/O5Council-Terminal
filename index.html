<!-- PART 1: HTML HEAD & STYLES -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SCP Foundation - Site Excalibur</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Courier New', Courier, monospace;
      background: black;
      color: #0f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      background-color: #111;
      padding: 10px 20px;
      border-bottom: 2px solid #0f0;
    }
    header img {
      height: 50px;
      margin-right: 20px;
    }
    header h1 {
      font-size: 1.5em;
      animation: glitch 1s infinite;
    }
    @keyframes glitch {
      0% { text-shadow: 2px 2px red; }
      25% { text-shadow: -2px -2px lime; }
      50% { text-shadow: 2px -2px blue; }
      75% { text-shadow: -2px 2px yellow; }
      100% { text-shadow: 2px 2px red; }
    }
    .login-container, .terminal-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .input-field {
      background-color: black;
      color: #0f0;
      border: 1px solid #0f0;
      font-size: 1.2em;
      padding: 10px;
      width: 300px;
      margin-top: 20px;
      border-radius: 5px;
      outline: none;
      text-align: center;
    }
    .terminal {
      width: 100%;
      height: 100%;
      padding: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .terminal-output {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .output-line {
      white-space: pre-wrap;
      margin-bottom: 5px;
    }
    .command-line {
      display: flex;
    }
    .input-line {
      flex: 1;
      background: transparent;
      border: none;
      color: #0f0;
      font-size: 1em;
      outline: none;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://th.bing.com/th/id/OIP.JPWG2Dz6CCmpyTMAuK9EkAAAAA?rs=1&pid=ImgDetMain" alt="SCP Logo">
    <h1>SCP Foundation - Site Excalibur : O5 Council Terminal</h1>
  </header>

  <div class="login-container" id="login-container">
    <div id="auth-text">Authorizing connection to O5-Council Terminal...</div>
    <input type="password" id="password-field" class="input-field" placeholder="Enter password" disabled>
  </div>

  <div class="terminal-container" id="terminal-container" style="display: none;">
    <div class="terminal">
      <div class="terminal-output" id="terminal-output"></div>
      <div class="command-line">
        <span style="color: #0f0;">&gt;</span>
        <input type="text" id="input-line" class="input-line" autocomplete="off">
      </div>
    </div>
  </div>
<!-- END OF PART 1 -->
<!-- PART 2: LOGIN SCRIPT -->
<script>
  const authText = document.getElementById('auth-text');
  const passwordField = document.getElementById('password-field');
  const loginContainer = document.getElementById('login-container');
  const terminalContainer = document.getElementById('terminal-container');
  const terminalOutput = document.getElementById('terminal-output');
  const inputLine = document.getElementById('input-line');

  const bootLines = [
    "[ACCESS LEVEL: O5-Council Only]",
    "Establishing encrypted connection to SCPNET...",
    "Terminal handshake with Site-EX successful.",
    "Routing clearance through O5 Command Core...",
    "Verifying retinal and DNA signatures...",
    "Authentication chain validated.",
    "Authorizing session...",
    "Access Granted to Site Excalibur Mainframe"
  ];

  let loginIndex = 0;

  function typeBootLines() {
    if (loginIndex < bootLines.length) {
      authText.textContent = bootLines[loginIndex];
      loginIndex++;
      setTimeout(typeBootLines, 1300);
    } else {
      authText.textContent = "Enter Password: ********";
      setTimeout(() => {
        typePassword("********", 0);
      }, 800);
    }
  }

  function typePassword(pass, index) {
    if (index < pass.length) {
      passwordField.value += pass[index];
      setTimeout(() => typePassword(pass, index + 1), 180);
    } else {
      setTimeout(() => {
        loginContainer.style.display = 'none';
        terminalContainer.style.display = 'flex';
        welcomeMessage();
      }, 1000);
    }
  }

  function welcomeMessage() {
    printOutput("Welcome, O5-Council Member.");
    printOutput("Access Level: ████████");
    printOutput("Site: Excalibur (Deep Terminal Node: #019-Alpha)");
    printOutput("Type 'help' to view available commands.");
    inputLine.focus();
  }

  function printOutput(text) {
    const line = document.createElement('div');
    line.className = 'output-line';
    line.textContent = text;
    terminalOutput.appendChild(line);
    terminalOutput.scrollTop = terminalOutput.scrollHeight;
  }

  window.onload = () => {
    typeBootLines();
  };
</script>
<!-- END OF PART 2 -->
<!-- PART 3: COMMAND HANDLING & TERMINAL FILES -->
<script>
  const commands = {
    'help': function() {
      printOutput("Available commands:");
      printOutput("help - Display this message.");
      printOutput("list - List available files.");
      printOutput("scp - Access SCP-related documents.");
      printOutput("taskforce - View Task Force operations.");
      printOutput("redacted - Access Redacted/Secret files.");
      printOutput("exit - Exit the terminal.");
    },
    'list': function() {
      printOutput("Listing available files...");
      printOutput("SCP Directory - /scp");
      printOutput("Task Force Directory - /taskforce");
      printOutput("Redacted Files - /redacted");
      printOutput("Type 'scp', 'taskforce', or 'redacted' followed by file number for access.");
    },
    'scp': function() {
      printOutput("Accessing SCP files...");
      printOutput("SCP-███ - [REDACTED]");
      printOutput("SCP-████ - [CONFIDENTIAL]");
      printOutput("SCP-█████ - [CLASSIFIED]");
    },
    'taskforce': function() {
      printOutput("Accessing Task Force operation logs...");
      printOutput("TF-███ - Operation ████ - [SECRET]");
      printOutput("TF-████ - Operation ████ - [RESTRICTED]");
      printOutput("TF-█████ - Operation █████ - [CLASSIFIED]");
    },
    'redacted': function() {
      printOutput("Accessing Redacted/Secret Files...");
      printOutput("File 001 - [REDACTED]");
      printOutput("File 002 - [CONFIDENTIAL]");
      printOutput("File 003 - [CLASSIFIED]");
    },
    'exit': function() {
      printOutput("Exiting terminal...");
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    }
  };

  function handleCommand(command) {
    if (commands[command]) {
      commands[command]();
    } else {
      printOutput("Unknown command: " + command);
      printOutput("Type 'help' for a list of available commands.");
    }
  }

  inputLine.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      const command = inputLine.value.trim();
      printOutput("&gt; " + command);
      handleCommand(command);
      inputLine.value = '';
      inputLine.focus();
    }
  });
</script>
<!-- END OF PART 3 -->
