<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SCP O5 Council Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #000;
      color: #0f0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 20px;
      background-color: #111;
      padding: 10px 20px;
      border-bottom: 2px solid #0f0;
    }

    header img {
      height: 60px;
      filter: grayscale(100%) brightness(0.8);
    }

    .glitch-text {
      font-size: 1.2em;
      position: relative;
      color: #0f0;
      text-shadow: 1px 0 red, -1px 0 blue;
      animation: glitch 1s infinite;
    }

    @keyframes glitch {
      0%, 100% { text-shadow: 2px 0 red, -2px 0 blue; }
      50% { text-shadow: -2px 0 red, 2px 0 blue; }
    }

    .terminal {
      height: calc(100vh - 90px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .boot-screen, .main-terminal {
      display: none;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      width: 100%;
      height: 100%;
      padding: 40px;
      text-align: left;
      overflow: hidden;
    }

    .boot-line, .main-line {
      white-space: pre-wrap;
      margin: 2px 0;
    }

    .typed-line {
      border-right: 2px solid #0f0;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .output-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
      width: 100%;
      overflow: hidden;
      padding: 0 20px;
    }

    .input-line::before {
      content: "> ";
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://th.bing.com/th/id/OIP.JPWG2Dz6CCmpyTMAuK9EkAAAAA?rs=1&pid=ImgDetMain" alt="SCP Logo">
    <div class="glitch-text">SCP Foundation – Site Excalibur : O5 Council Terminal</div>
  </header>

  <div class="terminal">
    <div class="boot-screen" id="boot-screen"></div>

    <div class="main-terminal hidden" id="main-terminal">
      <div class="output-wrapper" id="terminal-output">
        <div class="main-line input-line hidden" id="input-line"></div>
      </div>
    </div>
  </div>

  <script>
    const bootScreen = document.getElementById("boot-screen");
    const mainTerminal = document.getElementById("main-terminal");
    const terminalOutput = document.getElementById("terminal-output");
    const inputLine = document.getElementById("input-line");
    const MAX_LINES = 18;

    const bootSequence = [
      "[SCP FOUNDATION INTERNAL SYSTEM]",
      "SITE: EXCALIBUR - TERMINAL NODE 05-SEC",
      "Establishing secure uplink...",
      "Verifying temporal encryption sync...",
      "Council-level biometric handshake: VERIFIED",
      "LOADING TERMINAL ENVIRONMENT...",
      "Authentication Required:",
      "Enter O5 Clearance Credentials: ███-███-████-█"
    ];

    let bootIndex = 0;

    function typeLine(text, index, callback) {
      let line = document.createElement("div");
      line.className = "boot-line";
      bootScreen.appendChild(line);
      let i = 0;
      function typeChar() {
        if (i < text.length) {
          line.textContent += text[i++];
          setTimeout(typeChar, 35);
        } else {
          callback();
        }
      }
      typeChar();
    }

    function runBootSequence() {
      bootScreen.style.display = "flex";
      function nextLine() {
        if (bootIndex < bootSequence.length) {
          typeLine(bootSequence[bootIndex], bootIndex, () => {
            bootIndex++;
            nextLine();
          });
        } else {
          const authLine = document.createElement("div");
          authLine.className = "boot-line";
          authLine.textContent = "ACCESS AUTHORIZED [O5-CNCL]";
          bootScreen.appendChild(authLine);
          setTimeout(() => transitionToMainTerminal(), 1500);
        }
      }
      nextLine();
    }

    function transitionToMainTerminal() {
      bootScreen.classList.add("hidden");
      mainTerminal.classList.remove("hidden");
      addLine("Welcome to SCP Terminal Node: Site Excalibur [O5 Access]");
      runCommandInterface();
    }

    function addLine(text, delay = 0) {
      setTimeout(() => {
        const line = document.createElement('div');
        line.className = 'main-line';
        line.textContent = text;
        terminalOutput.appendChild(line);
        maintainBuffer();
      }, delay);
    }

    function maintainBuffer() {
      const lines = terminalOutput.querySelectorAll('.main-line');
      if (lines.length > MAX_LINES) {
        lines[0].remove();
      }
    }

    function runCommandInterface() {
      const commandMap = {
        help: [
          'Available Commands:',
          ' - help         → List all available commands',
          ' - list         → Display classified documents',
          ' - access [id]  → Access a specific file (e.g., access O5-█)',
          ' - logout       → Exit the terminal'
        ],
        list: [
          'Secure Files:',
          ' - O5-█.scpd',
          ' - SiteEx-47-Report.txt',
          ' - Event-BlackoutLog.docx'
        ],
        logout: ['Logging out...', 'Session terminated.']
      };

      const readline = () => {
        inputLine.classList.remove('hidden');
        inputLine.textContent = '> ';
        let inputBuffer = '';

        document.addEventListener('keydown', function onKey(e) {
          if (e.key.length === 1 && inputBuffer.length < 40) {
            inputBuffer += e.key;
          } else if (e.key === 'Backspace') {
            inputBuffer = inputBuffer.slice(0, -1);
          } else if (e.key === 'Enter') {
            document.removeEventListener('keydown', onKey);
            inputLine.classList.add('hidden');
            addLine(`> ${inputBuffer}`);

            const cmd = inputBuffer.trim().split(' ')[0].toLowerCase();
            const param = inputBuffer.trim().split(' ')[1];

            if (commandMap[cmd]) {
              commandMap[cmd].forEach((line, i) => addLine(line, i * 100));
            } else if (cmd === 'access' && param) {
              addLine(`Accessing file: ${param}...`);
              addLine(`[REDACTED CONTENT - LEVEL 5 REQUIRED]`, 500);
            } else {
              addLine('Unknown command. Type "help" for assistance.');
            }

            setTimeout(() => readline(), 1000);
          }

          inputLine.textContent = `> ${inputBuffer}`;
        });
      };

      setTimeout(() => {
        addLine('Type "help" to list commands.', 300);
        setTimeout(() => readline(), 1000);
      }, 500);
    }

    window.onload = runBootSequence;
  </script>
</body>
</html>
